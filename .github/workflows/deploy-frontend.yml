name: Deploy Frontend to Azure

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'fenicia-web/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  FRONTEND_PATH: './fenicia-web'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_PATH }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_PATH }}
        run: npm ci

      - name: Build production bundle
        working-directory: ${{ env.FRONTEND_PATH }}
        run: npm run build
        env:
          VITE_AUTH_API_BASE_URL: ${{ secrets.AZURE_AUTH_API_URL }}
          VITE_BASIC_API_BASE_URL: ${{ secrets.AZURE_BASIC_API_URL }}
          VITE_PROJECTS_API_BASE_URL: ${{ secrets.AZURE_PROJECTS_API_URL }}

      # Option A: Deploy to Azure Static Web Apps (Recommended for React SPAs)
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "${{ env.FRONTEND_PATH }}/build"
          skip_app_build: true

      # Option B: Deploy to Azure App Service (Linux) - Uncomment if using App Service instead
      # - name: Login to Azure
      #   uses: azure/login@v2
      #   with:
      #     creds: ${{ secrets.AZURE_CREDENTIALS }}
