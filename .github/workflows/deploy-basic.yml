name: Deploy Fenicia.Module.Basic to Azure

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Fenicia.Module.Basic/**'
      - 'Fenicia.Common/**'
      - 'Fenicia.Common.Api/**'
      - 'Fenicia.Common.Data/**'
      - '.github/workflows/deploy-basic.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: fenicia-basic-api
  AZURE_CONTAINER_REGISTRY: feniciacr.azurecr.io
  IMAGE_NAME: fenicia-module-basic

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AZURE_CONTAINER_REGISTRY }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Fenicia.Module.Basic/Dockerfile
          push: true
          tags: |
            ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App (Container)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: '${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'

      - name: Set Web App environment variables
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az webapp config appsettings set \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --settings \
                "DOTNET_ENVIRONMENT=Production" \
                "ConnectionStrings__Auth=${{ secrets.AZURE_POSTGRES_CONNECTION_STRING }}" \
                "ASPNETCORE_URLS=http://+:8080"
