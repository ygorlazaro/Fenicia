name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: cd Src/Front && npm ci
      - run: cd Src/Front && npm run type-check
      - run: cd Src/Front && npm run lint
      - run: cd Src/Front && npm run build

  build:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Fenicia.sln
      - run: dotnet build Fenicia.sln --configuration Release --no-restore

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Fenicia.sln
      - run: dotnet test Fenicia.sln --configuration Release --collect:"XPlat Code Coverage;Format=Cobertura" --results-directory /tmp/coverage-all
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-all
          path: /tmp/coverage-all/**/coverage.cobertura.xml
          retention-days: 7
