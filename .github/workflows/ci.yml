name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Fenicia.slnx
      - run: dotnet build Fenicia.slnx --configuration Release --no-restore

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Fenicia.slnx
      - run: dotnet build Fenicia.Web.E2ETests/Fenicia.Web.E2ETests.csproj --configuration Release --no-restore
      - run: pwsh Fenicia.Web.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps
      - run: sudo apt-get update && sudo apt-get install -y xvfb curl
      - run: dotnet run --project Fenicia.Web/Fenicia.Web.csproj --configuration Release --urls "http://0.0.0.0:5104" &
      - run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5104/ > /dev/null 2>&1 || curl -sf http://localhost:5104/login > /dev/null 2>&1; then
              echo "Servidor web está respondendo na porta 5104"
              break
            fi
            echo "Aguardando servidor web iniciar... ($i/60)"
            sleep 2
          done
          # Verificar se o servidor realmente iniciou
          if ! curl -sf http://localhost:5104/ > /dev/null 2>&1 && ! curl -sf http://localhost:5104/login > /dev/null 2>&1; then
            echo "ERRO: Servidor web não iniciou após 120 segundos"
            exit 1
          fi
      - run: sleep 5
      - run: xvfb-run dotnet test Fenicia.slnx --configuration Release --collect:"XPlat Code Coverage;Format=Cobertura" --results-directory /tmp/coverage-all
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-all
          path: /tmp/coverage-all/**/coverage.cobertura.xml
          retention-days: 7
