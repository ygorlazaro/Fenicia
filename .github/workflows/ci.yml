name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Fenicia.sln
      - run: dotnet build Fenicia.sln --configuration Release --no-restore

  test-auth:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Fenicia.sln
      - run: dotnet test Fenicia.Auth.Tests/Fenicia.Auth.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage;Format=Cobertura" --results-directory /tmp/coverage-auth
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-auth
          path: /tmp/coverage-auth/**/coverage.cobertura.xml
          retention-days: 7

  test-basic:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Fenicia.sln
      - run: dotnet test Fenicia.Module.Basic.Tests/Fenicia.Module.Basic.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage;Format=Cobertura" --results-directory /tmp/coverage-basic
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-basic
          path: /tmp/coverage-basic/**/coverage.cobertura.xml
          retention-days: 7

  test-other:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Fenicia.sln
      - run: dotnet test Fenicia.sln --configuration Release --no-build --verbosity normal --filter "FullyQualifiedName!~Fenicia.Auth.Tests&FullyQualifiedName!~Fenicia.Module.Basic.Tests"
