name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Fenicia.sln
      - run: dotnet build Fenicia.sln --configuration Release --no-restore
      - run: dotnet test Fenicia.sln --configuration Release --no-build --verbosity normal
